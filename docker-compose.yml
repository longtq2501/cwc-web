version: '3.8'

services:
  # 1. Frontend Service (Khớp với cổng 3000 trong package.json của bạn)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecocollect-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_PORT=3000
      - CHOKIDAR_USEPOLLING=true
    networks:
      - ecocollect-network

  # 2. Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecocollect-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=ecocollect
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ecocollect-network

  # 3. Database Service (MySQL)
  db:
    image: mysql:8.0
    container_name: ecocollect-db
    restart: always
    environment:
      MYSQL_DATABASE: ecocollect
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ecocollect-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecocollect-network

networks:
  ecocollect-network:
    driver: bridge

volumes:
  ecocollect-db-data:
